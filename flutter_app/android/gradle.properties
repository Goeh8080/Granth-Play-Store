org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Split APKs (--split-per-abi) keep the pubspec versionCode as-is (no 1000×ABI offset),
# so every APK of a release reports the same versionCode.
force-version-code-ignoring-abi=true
