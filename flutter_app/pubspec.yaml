name: granthprabandhan
description: "ग्रंथ प्रबंधन — native Flutter app (विषय, ग्रंथ, प्रमाण, गैलरी, PDF)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  animations: ^2.0.11
  app_links: ^6.4.0
  connectivity_plus: ^7.0.0
  dio: ^5.8.0
  flutter_svg: ^2.1.0
  image: ^4.5.0
  open_filex: ^4.7.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  share_plus: ^12.0.0
  shared_preferences: ^2.5.3
  unorm_dart: ^0.3.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/NotoSansDevanagari-Full.ttf
  fonts:
    - family: NotoDeva
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
    - family: YatraOne
      fonts:
        - asset: assets/fonts/YatraOne-Devanagari.ttf
    - family: YatraOneLatin
      fonts:
        - asset: assets/fonts/YatraOne-Latin.ttf
    # Full Devanagari font: the fallback named by every text style (it was bundled but never
    # registered, so the fallback did nothing).
    - family: NotoDevaFull
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Full.ttf
    - family: TiroDevanagari
      fonts:
        - asset: assets/fonts/TiroDevanagariSanskrit-Regular.ttf
    - family: NotoDevaFull
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Full.ttf
