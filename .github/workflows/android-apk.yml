name: Android APK (Flutter)

on:
  push:
    branches: [main, master, flutter-port]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # APP_KEY (optional repository secret): the permanent app identifier for the admin dashboard's
      # "verified installs". Without the secret (forks, PRs, not yet added) the build simply has no key.
      - name: Build APK
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          set +x
          args=""
          if [ -n "$APP_KEY" ]; then
            printf '{"APP_KEY":"%s"}' "$APP_KEY" > "$RUNNER_TEMP/dd.json"
            args="--dart-define-from-file=$RUNNER_TEMP/dd.json"
          fi
          flutter build apk --release $args
          rm -f "$RUNNER_TEMP/dd.json"

      - name: Kotlin unit tests (PDF notification service)
        working-directory: flutter_app/android
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: granth-flutter-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
