name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        working-directory: mobile
        run: npm ci

      - name: Android SDK packages
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SM"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Build both versions
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          mkdir -p "$GITHUB_WORKSPACE/dist/1.0.0" "$GITHUB_WORKSPACE/dist/1.0.1"
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace -PverCode=1 -PverName=1.0.0 -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/dist/1.0.0/granth-prabandhan-1.0.0.apk"
          cp app/build/outputs/bundle/release/*.aab "$GITHUB_WORKSPACE/dist/1.0.0/granth-prabandhan-1.0.0.aab"
          ./gradlew clean assembleRelease bundleRelease --no-daemon --stacktrace -PverCode=20 -PverName=1.0.1 -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/dist/1.0.1/granth-prabandhan-1.0.1.apk"
          cp app/build/outputs/bundle/release/*.aab "$GITHUB_WORKSPACE/dist/1.0.1/granth-prabandhan-1.0.1.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: granth-both
          path: dist/**/*
          if-no-files-found: error
