name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        working-directory: mobile
        run: npm ci

      - name: Android SDK packages
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SM"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Build debug-signed APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PverCode=23 -PverName=1.0.1 -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)
          test -n "$APK"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/granth-prabandhan.apk"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -c -v 4 "$GITHUB_WORKSPACE/dist/granth-prabandhan.apk"
          "$BT/apksigner" verify -v --min-sdk-version 21 --print-certs "$GITHUB_WORKSPACE/dist/granth-prabandhan.apk"
          "$BT/aapt" dump badging "$GITHUB_WORKSPACE/dist/granth-prabandhan.apk" | head -n 5

      - uses: actions/upload-artifact@v4
        with:
          name: granth-prabandhan-debug
          path: dist/granth-prabandhan.apk
          if-no-files-found: error
